{% if chart %}<figure class="card"><figcaption>Фактическая сложность по шагам</figcaption><svg viewBox="0 0 710 215" role="img" aria-label="График сложности вопросов по шагам"><path d="M35 20 V170 H675" fill="none" stroke="#a1adbc"/>{% for level in '54321' %}<text x="10" y="{% cycle '30' '65' '100' '135' '170' %}" font-size="12">{{ level }}</text>{% endfor %}<polyline points="{% for p in chart %}{{ p.x|stringformat:'.2f' }},{{ p.y|stringformat:'.2f' }} {% endfor %}" fill="none" stroke="#256c68" stroke-width="3"/>{% for p in chart %}<circle cx="{{ p.x|stringformat:'.2f' }}" cy="{{ p.y|stringformat:'.2f' }}" r="4" fill="#256c68"><title>Шаг {{ p.step }}: уровень {{ p.level }}</title></circle><text x="{{ p.x|stringformat:'.2f' }}" y="194" text-anchor="middle" font-size="11">{{ p.step }}</text>{% endfor %}</svg></figure>{% endif %}
